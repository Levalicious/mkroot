name: ci
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Levalicious/mk@8b33eaa94d5ae53a70b0f3b2cfd9fb1432f8cc9e
      - uses: ./
      - name: a library and a program through mklib and mkone (the archive a real prerequisite)
        run: |
          echo "MKROOT=$MKROOT objtype=$objtype"
          cd test/hello && mk && ./hello | grep -q 'hello from mkroot'
      - name: each directory cleans its own products
        run: cd test/hello && mk clean && test ! -e hello && test -e ../greet/libgreet.a && (cd ../greet && mk clean) && test ! -e ../greet/libgreet.a
